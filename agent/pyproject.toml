[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dhnam", email = "dhnam0502@naver.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "shared",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared = { path = "../shared", editable = true }

[tool.pyrefly]
project-includes = ["../shared/**/*.py"]