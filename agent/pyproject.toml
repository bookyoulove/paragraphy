[project]
name = "agent"
version = "0.1.0"
description = "Paragraphy LangGraph agents"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.15",
    "langchain-openai>=1.5.0",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "typing-extensions>=4.15.0",
    "shared",
    "bareunpy>=2.1.0",
    "chromadb>=1.5.9",
    "tenacity>=9.1.4",
    "langfuse>=3.0.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared = { workspace = true }

[tool.ruff.lint]
ignore = ["BLE001"]
